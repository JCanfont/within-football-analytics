name: Flashscore alert tick

# Vercel Hobby cannot run sub-daily crons. GitHub schedules are at best every
# 5 minutes, so each run checks once per minute for five minutes to approximate
# a one-minute alert loop without leaving the website open.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call Flashscore tick every minute
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub secret CRON_SECRET (same value as Vercel CRON_SECRET)."
            exit 1
          fi
          BASE_URL="${APP_URL:-https://within-football-analytics.vercel.app}"
          BASE_URL="${BASE_URL%/}"
          for minute in 1 2 3 4 5; do
            echo "Tick ${minute}/5"
            curl -fsS \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${BASE_URL}/api/flashscore/tick"
            echo
            if [ "${minute}" -lt 5 ]; then
              sleep 60
            fi
          done
