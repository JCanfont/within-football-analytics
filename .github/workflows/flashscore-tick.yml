name: Flashscore alert tick

# Vercel Hobby cannot run sub-daily crons. Keep this to one call every 5 minutes
# so FlashScore4 RapidAPI quota is not exhausted; the page can still refresh
# more often using a short server-side cache.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call Flashscore tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub secret CRON_SECRET (same value as Vercel CRON_SECRET)."
            exit 1
          fi
          BASE_URL="${APP_URL:-https://within-football-analytics.vercel.app}"
          BASE_URL="${BASE_URL%/}"
          curl -fsS \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/flashscore/tick"
          echo
