name: Flashscore alert tick

# Optional manual tick only. Live scores now come from SofaScore on the
# Flashscore page; RapidAPI is reserved for on-demand odds capture.
on:
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call Flashscore tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub secret CRON_SECRET (same value as Vercel CRON_SECRET)."
            exit 1
          fi
          BASE_URL="${APP_URL:-https://within-football-analytics.vercel.app}"
          BASE_URL="${BASE_URL%/}"
          curl -fsS \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/flashscore/tick"
          echo
