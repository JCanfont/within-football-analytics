name: Flashscore alert tick

# Flashscore Ultra background tick. Needs a captured ≤1.60 watchlist
# synced from the Flashscore page and RAPIDAPI_KEY on Vercel.
on:
  schedule:
    # Every minute — early window uses each tick; after 30' the API skips to 5 min cadence.
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call Flashscore tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub secret CRON_SECRET (same value as Vercel CRON_SECRET)."
            exit 1
          fi
          BASE_URL="${APP_URL:-https://within-football-analytics.vercel.app}"
          BASE_URL="${BASE_URL%/}"
          curl -fsS \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/flashscore/tick"
          echo
